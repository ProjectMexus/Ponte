# Same-origin routing for the Ponte web demo.
# Static UI comes from the image; every /api/ request is proxied to the
# middleware container so the browser never needs a Docker-only hostname.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Voice multipart uploads allow up to 4 MiB (middleware enforces the
    # real limit); give nginx some headroom above it.
    client_max_body_size 8m;

    # Repository-root avatar served by the local Python static server.
    location = /ponte2.jpg {
        alias /usr/share/nginx/assets/ponte2.jpg;
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://middleware:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Interaction and voice turns include LLM round trips upstream.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
