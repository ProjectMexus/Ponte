<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="color-scheme" content="light" />
    <title>Ponte 語音服務</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="voice-app">
    <header class="voice-header">
      <a class="brand-block" href="/" aria-label="Ponte home">Ponte</a>
      <div class="header-controls">
        <div class="connection-stack">
          <span id="health-status" class="health-status" role="status" aria-live="polite">正在連線</span>
          <span id="connection-label" class="connection-label">正在檢查語音服務</span>
        </div>
        <div id="language-toggle" class="language-toggle" role="group" aria-label="顯示語言">
          <button class="language-option is-active" type="button" data-locale="zh-Hant" aria-pressed="true">繁中</button>
          <button class="language-option" type="button" data-locale="en" aria-pressed="false">ENG</button>
        </div>
      </div>
    </header>

    <main class="voice-shell">
      <section class="ponte-stage" aria-labelledby="voice-title">
        <h1 id="voice-title" class="sr-only">Ponte 語音服務</h1>
        <button id="ponte-button" class="ponte-button" type="button" aria-label="點按小澳開始說話" aria-pressed="false" aria-describedby="voice-state">
          <span class="ponte-rings" aria-hidden="true"><i></i><i></i><i></i></span>
          <img id="ponte-avatar" src="/ponte2.jpg" alt="Ponte" data-default-avatar="/ponte2.jpg" />
          <span id="avatar-action-label" class="sr-only">點按開始或停止語音</span>
        </button>
        <p id="voice-state" class="voice-state" role="status" aria-live="polite">準備好了。點按小澳開始說話。</p>
        <div class="voice-status-panel" aria-hidden="true">
          <span id="voice-status-label" class="voice-status-label">準備好了</span>
          <span id="voice-status-hint" class="voice-status-hint">點按小澳開始說話</span>
        </div>
        <div class="voice-meter" aria-hidden="true"><span id="voice-meter-fill"></span></div>
        <div id="operational-status" class="operational-status">
          <span class="status-chip"><span id="service-status-label" class="status-chip-label">服務</span><strong id="service-status-value">連線中</strong></span>
          <span class="status-chip"><span id="voice-path-label" class="status-chip-label">語音</span><strong id="voice-path-value">檢查中</strong></span>
          <span class="status-chip"><span id="microphone-status-label" class="status-chip-label">麥克風</span><strong id="microphone-status-value">待命</strong></span>
        </div>
      </section>

      <section id="voice-exceptions" class="voice-exceptions" aria-live="polite" aria-label="Approval, receipt, and recovery messages">
        <div id="global-error" class="voice-error" role="alert" hidden></div>
        <div id="approval-region"></div>
      </section>
      <div id="conversation-caption" class="conversation-caption" role="status" aria-live="polite" aria-atomic="true">
        <span id="caption-line" class="caption-line"></span>
      </div>
    </main>

    <aside id="artifact-drawer" class="artifact-drawer" aria-labelledby="artifact-heading" aria-modal="true" role="dialog" hidden>
      <div class="artifact-backdrop" data-artifact-close></div>
      <section class="artifact-sheet">
        <header class="artifact-header">
          <div><p class="exception-kicker">Action receipt</p><h2 id="artifact-heading">Ponte</h2></div>
          <button type="button" class="artifact-close" data-artifact-close aria-label="Close receipt">×</button>
        </header>
        <div id="artifact-content" class="artifact-content"></div>
      </section>
    </aside>

    <script type="module" src="/app.js"></script>
  </body>
</html>
